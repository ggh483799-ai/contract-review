name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 支持手动触发

concurrency:
  group: deploy-contract-review
  cancel-in-progress: false   # 部署不并发、不取消，排队执行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/contract-review
            echo "[INFO] git pull: $(date '+%F %T')"
            ok=0
            for i in 1 2 3; do
              if git pull origin main; then ok=1; break; fi
              echo "[WARN] git pull 第 ${i} 次失败，10s 后重试"
              sleep 10
            done
            if [ "$ok" -ne 1 ]; then echo "[ERROR] git pull 连续 3 次失败"; exit 1; fi
            echo "[INFO] docker compose up -d --build"
            sudo docker compose up -d --build
            echo "[INFO] 等待服务就绪..."
            sleep 15

      - name: Health check (on server)
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            fail=0
            for url in http://127.0.0.1:8020/healthz http://127.0.0.1:8020/; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url")
              echo "HEALTH $url -> $code"
              case "$code" in 200) ;; *) fail=1 ;; esac
            done
            # OCR 冒烟：容器内真实跑一次 渲染+识别（healthz 测不出系统库缺失）
            if sudo docker exec contract-review python -c "
import fitz
from rapidocr_onnxruntime import RapidOCR
d = fitz.open(); p = d.new_page(); p.insert_text((72, 72), 'OCR smoke')
eng = RapidOCR(); result, _ = eng(p.get_pixmap().tobytes('png'))
assert result, 'OCR 无结果'
print('OCR-SMOKE-OK')
" 2>/dev/null; then echo "OCR 冒烟通过"; else echo "[ERROR] OCR 冒烟失败"; fail=1; fi
            sudo docker compose -f /opt/contract-review/docker-compose.yml ps
            if [ "$fail" -ne 0 ]; then echo "[ERROR] 健康检查未全部通过"; exit 1; fi
            echo "[INFO] 全部健康检查通过，部署完成"
